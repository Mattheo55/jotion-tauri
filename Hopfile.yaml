tasks:
  dev:
    comment: Démarre l'application en mode développement
    run: |
      npm run tauri dev
  migrate:
    run: |
      npx drizzle-kit generate
  studio:
    run: |
      npx drizzle-kit studio
  build-win:
    comment: Build l'application en mode release (Windows)
    run: |
      npm run tauri build
      explorer .\src-tauri\target\release\bundle\msi